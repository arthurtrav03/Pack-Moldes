<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="darkGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>
  </defs>
  <!-- Outer starburst / scalloped badge -->
  <circle cx="100" cy="100" r="95" fill="url(#gold)" stroke="#B45309" stroke-width="3" />
  <circle cx="100" cy="100" r="82" fill="#FEF3C7" stroke="#D97706" stroke-width="2" stroke-dasharray="4 2" />
  <circle cx="100" cy="100" r="70" fill="url(#gold)" />
  <!-- Text content -->
  <text x="100" y="65" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="14" fill="#451A03" text-anchor="middle" letter-spacing="2">GARANTIA</text>
  <text x="100" y="112" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="44" fill="#451A03" text-anchor="middle">7</text>
  <text x="100" y="132" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="16" fill="#451A03" text-anchor="middle" letter-spacing="1">DIAS</text>
  <text x="100" y="152" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="10" fill="#78350F" text-anchor="middle" letter-spacing="0.5">100% INCONDICIONAL</text>
</svg>
